filter {
    ###
    # This filter looks-up info about CRIC metadata from the WLCG-CRIC endpoint. A script reads from the 
    # WLCG-CRIC endpoint and generates a MaxMind DB (mmdb) file. MMDB files organize IPs into
    # binary trees for fast searches. The geoip logstash filter only knows
    # how to interpret certain MaxMind DBs like the City DB so we have to fake things
    # to look like the CityDB by putting a JSON string in the "city_name" and then
    # expanding the JSON here in logstash. 
    ##
    geoip {
        id => "geo_src"
        database => "/etc/stardust/pipeline/cric.mmdb"
        default_database_type => "City"
        cache_size => 1000
        source => "[meta][src_ip]"
        target => "[meta][cric][src]"
    }
    # break up the json in city_name into indiv fields (target gets totally overwritten with the info from the json)
    json {
        id => "geo_src_json"
        source => "[meta][cric][src][city_name]"
        target => "[meta][cric][src]"
    }
    geoip {
        id => "geo_dst"
        database => "/etc/stardust/pipeline/cric.mmdb"
        default_database_type => "City"
        cache_size => 1000
        source => "[meta][dst_ip]"
        target => "[meta][cric][dst]"
    }
    # break up the json in city_name into indiv fields (target gets totally overwritten with the info from the json)
    json {
        id => "geo_dst_json"
        source => "[meta][cric][dst][city_name]"
        target => "[meta][cric][dst]"
    }

    # Geoip/DNS resolution for syslog/hostname
    #
    mutate {
	id => "init_ip"
	add_field => { "[meta][syslog][ip]" => "%{[meta][syslog][hostname]}" }
    }

    # Check if the value is not an IPv4 or IPv6 address
    if [meta][syslog][ip] !~ /^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$/ and 
       [meta][syslog][ip] !~ /^[0-9a-fA-F:]+$/ {

	# Attempt to resolve the hostname
	dns {
	    id => "dns_resolve_hostname"
	    resolve => [ "[meta][syslog][ip]" ]
	    action => "replace"
	    timeout => 0.5 
	    attempts => 1
	    hit_cache_size => 10000
	    hit_cache_ttl => 86400
	    failed_cache_size => 10000
	    failed_cache_ttl => 3600
	}

	# Extract first IP from array (only runs if we attempted a DNS lookup)
	ruby {
	    id => "extract_first_ip_from_dns"
	    code => "
		ips = event.get('[meta][syslog][ip]')
		if ips && ips.is_a?(Array) && !ips.empty?
		    event.set('[meta][syslog][ip]', ips.first)
		end
	    "
	}

	# If DNS failed to resolve, the field will still contain the original 
	# hostname/invalid string. We catch it here and force it to 0.0.0.0.
	if [meta][syslog][ip] !~ /^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$/ and 
	   [meta][syslog][ip] !~ /^[0-9a-fA-F:]+$/ {
	    mutate {
		id => "fallback_to_zero_ip"
		replace => { "[meta][syslog][ip]" => "0.0.0.0" }
	    }
	}
    }

    # 3. Perform GeoIP lookup 
    geoip {
	id => "geo_hostname"
	database => "/etc/stardust/pipeline/cric.mmdb"
	default_database_type => "City"
	cache_size => 1000
	source => "[meta][syslog][ip]"
	target => "[meta][syslog][geoip]"
    }

    # 4. Extract site name from geoip result
    json {
	id => "geo_hostname_json"
	source => "[meta][syslog][geoip][city_name]"
	target => "[meta][syslog][geoip]"
    }
}
