filter {

	mutate {
		rename => { "[flow-id][src-port]" => "[meta][src_port]" }
		rename => { "[flow-id][protocol]" => "[meta][protocol]" }
		rename => { "[flow-id][src-ip]" => "[meta][src_ip]" }
		rename => { "[flow-id][dst-port]" => "[meta][dst_port]" }
		rename => { "[flow-id][dst-ip]" => "[meta][dst_ip]" }
		rename => { "[syslog_timestamp]" => "[meta][syslog][timestamp]" }
		rename => { "[syslog_version]" => "[meta][syslog][version]" }
		rename => { "[hostname]" => "[meta][syslog][hostname]" }
		rename => { "[program]" => "[meta][syslog][app_name]" }
		rename => { "[flow_fingerprint]" => "[meta][id]" }
		rename => { "[flow-lifecycle][state]" => "[meta][state]" }

		rename => { "[context][activity-id]" => "[meta][activity_id]" }
		rename => { "[context][application]" => "[meta][application]" }
		rename => { "[context][experiment-id]" => "[meta][experiment_id]" }

		rename => { "[version]" => "[meta][firefly_version]" }
		# sent by dCache releases that name the supplier of the data as src (see below)
		rename => { "[dcache-version]" => "[meta][dcache_version]" }
                rename => { "[usage][received]" => "[values][usage][received]" }
                rename => { "[usage][sent]" => "[values][usage][sent]" }
                rename => { "[netlink][rtt]" => "[values][netlink][rtt]" }
                rename => { "[storage-stats][bytes-transferred]" => "[values][storage][bytes_transferred]" }
                rename => { "[storage-stats][connection-time]" => "[values][storage][connection_time]" }
                rename => { "[storage-stats][read-active]" => "[values][storage][read_active]" }
                rename => { "[storage-stats][read-bw]" => "[values][storage][read_bw]" }
                rename => { "[storage-stats][read-idle]" => "[values][storage][read_idle]" }
                rename => { "[storage-stats][write-active]" => "[values][storage][write_active]" }
                rename => { "[storage-stats][write-bw]" => "[values][storage][write_bw]" }
                rename => { "[storage-stats][write-idle]" => "[values][storage][write_idle]" }
                rename => { "[storage-stats][result-code]" => "[values][storage][result_code]" }
                rename => { "[storage-stats][file-size]" => "[values][storage][file_size]" }
                rename => { "[storage-stats][io-mode]" => "[values][storage][io_mode]" }
                rename => { "[storage-stats][queue-time]" => "[values][storage][queue_time]" }
                rename => { "[storage-stats][pool-name]" => "[values][storage][pool_name]" }

		#gsub => ["[flow-id][afi]", "ipv6", 6]
                #gsub => ["[flow-id][afi]", "ipv4", 4]

		rename => { "[flow-id][afi]" => "[meta][ip_version]" }
                add_field => { "[@metadata][syslog_msg]" => "%{message}" }
	}

        # Make src the supplier of the data and dst its receiver.
        #
        # - dCache fireflies that carry "dcache-version" already name the supplier as src and
        #   count usage from the supplier's side (sent is the data): leave them as they are.
        # - Fireflies of earlier dCache releases always name the remote party as src and the dCache
        #   node as dst, and count usage from the dCache node's side. The node supplied the data
        #   when sent > received, so that is when src and dst have to be swapped.
        # - Other senders (XRootD names the server as src unless it knows better): swap when
        #   received > sent, except for http-put and http-get.
        if ![meta][dcache_version] and [values][usage][received] and [values][usage][sent] {
            if [meta][syslog][app_name] == "dCache" {
                if ([values][usage][sent] > [values][usage][received]) {
                    mutate { add_field => { "[@metadata][swap_src_dst]" => "true" } }
                }
            } else if [meta][application] not in ["http-put", "http-get"] {
                if ([values][usage][received] > [values][usage][sent]) {
                    mutate { add_field => { "[@metadata][swap_src_dst]" => "true" } }
                }
            }
        }
        if [@metadata][swap_src_dst] {
            mutate {
                copy => { "[meta][src_port]" => "[@metadata][tmp_src_port]" }
                copy => { "[meta][src_ip]" => "[@metadata][tmp_src_ip]" }
            }
            mutate {
                copy => { "[meta][dst_port]" => "[meta][src_port]" }
                copy => { "[meta][dst_ip]" => "[meta][src_ip]" }
                copy => { "[@metadata][tmp_src_port]" => "[meta][dst_port]" }
                copy => { "[@metadata][tmp_src_ip]" => "[meta][dst_ip]" }
            }
        }

	#mutate{
        #		convert => {"[meta][ip_version]" => "integer"}
	#}

	prune {
		whitelist_names => ["^meta$", "^start$", "^end$", "^duration$", "^throughput$", "^total_bytes$", "^message$", "^@timestamp$", "^values$", "^storage$"]
	}

        if ! [meta][state] { 
           drop { } 
        }
	
}


